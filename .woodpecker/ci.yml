# ─── defdo_s3 CI (push / pull_request / manual) ─────────────────────────────
#
# ─── Pipeline rule: compile ONCE, fan out ──────────────────────────────────
# All steps of a workflow share the same workspace volume, so `deps/` and
# `_build/` written by the `compile` step persist into every step that
# `depends_on` it. Downstream steps therefore NEVER recompile — they mount the
# warm `_build` and run their check straight away. `compile` warms BOTH envs
# (dev for warnings-as-errors + package build, test for the suite) so nothing
# after it pays a compile cost. `depends_on: [compile]` also lets `format` and
# `test` run in parallel once the single compile finishes.
#
# Runs on the docker/kubernetes agent (`platform: linux/amd64`): `image:` is a
# real container (elixir). The label is REQUIRED — without it a job can land
# on the darwin exec agent and die with `exec: "<image>": executable file not
# found` (that agent runs the local backend, where image = host binary). See
# the `defdo-woodpecker-ci` skill.

labels:
  platform: linux/amd64

when:
  - event: [push, pull_request]
    branch: main
  - event: manual

steps:
  - name: compile
    image: elixir:1.19.5
    when:
      event: [push, pull_request]
    commands:
      - mix do local.hex --force, local.rebar --force
      - mix deps.get
      - mix compile --warnings-as-errors
      - MIX_ENV=test mix compile --warnings-as-errors

  - name: format
    image: elixir:1.19.5
    when:
      event: [push, pull_request]
    depends_on: [compile]
    commands:
      - mix do local.hex --force, local.rebar --force
      - mix format --check-formatted

  - name: test
    image: elixir:1.19.5
    when:
      event: [push, pull_request]
    depends_on: [compile]
    commands:
      - mix do local.hex --force, local.rebar --force
      - mix test
