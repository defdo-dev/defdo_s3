# ─── defdo_s3 Woodpecker CI/CD ──────────────────────────────────────────────
#
# Runs on the docker/kubernetes agent (`platform: linux/amd64`): `image:` is a
# real container (elixir). The label is REQUIRED — without it a tag job can land
# on the darwin exec agent and die with `exec: "<image>": executable file not
# found` (that agent runs the local backend, where image = host binary). See the
# `defdo-woodpecker-ci` skill.

labels:
  platform: linux/amd64

when:
  - event: [push, pull_request]
    branch: main
  - event: tag
  - event: manual

steps:
  - name: format-and-compile
    image: elixir:1.19.5
    when:
      event: [push, pull_request]
    commands:
      - mix do local.hex --force, local.rebar --force
      - mix deps.get
      - mix format --check-formatted
      - mix compile --warnings-as-errors

  - name: test
    image: elixir:1.19.5
    when:
      event: [push, pull_request]
    commands:
      - mix do local.hex --force, local.rebar --force
      - mix deps.get
      - mix compile --warnings-as-errors
      - mix test

  - name: release-validate
    image: elixir:1.19.5
    when:
      event: tag
    environment:
      HEX_API_KEY:
        from_secret: hex_api_key
      HEX_ORG_TOKEN:
        from_secret: hex_org_token
    commands:
      - |
        set -e
        HEX_ORG_NAME="defdo"
        mix do local.hex --force, local.rebar --force
        if [ -n "$HEX_ORG_TOKEN" ]; then
          mix hex.organization auth "$HEX_ORG_NAME" --key "$HEX_ORG_TOKEN"
        fi
        mix deps.get
        mix format --check-formatted
        mix compile --warnings-as-errors
        mix test
        mix hex.build

  - name: hex-publish
    image: elixir:1.19.5
    when:
      event: tag
    depends_on: [release-validate]
    environment:
      HEX_API_KEY:
        from_secret: hex_api_key
      HEX_ORG_TOKEN:
        from_secret: hex_org_token
    commands:
      - |
        set -e
        HEX_ORG_NAME="defdo"
        if [ -z "$HEX_API_KEY" ]; then
          echo "ERROR: HEX_API_KEY is required to publish"
          exit 1
        fi
        mix do local.hex --force, local.rebar --force
        if [ -n "$HEX_ORG_TOKEN" ]; then
          mix hex.organization auth "$HEX_ORG_NAME" --key "$HEX_ORG_TOKEN"
        fi
        mix deps.get
        mix hex.publish --yes
